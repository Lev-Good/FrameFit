name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: בנייה ובדיקות
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: שחזור ובנייה
        run: dotnet build FrameFit.slnx -c Release

      - name: בדיקות יחידה
        run: dotnet test tests/FrameFit.Core.Tests/FrameFit.Core.Tests.csproj -c Release --no-build

  release:
    name: פרסום מהדורה
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: שחזור כלי האריזה (WiX)
        run: dotnet tool restore

      # קובץ הרצה אחד בלבד: כל הספריות הנייטיב של WPF נכללות בתוכו.
      - name: פרסום ניידי (קובץ אחד)
        run: >
          dotnet publish src/FrameFit.App/FrameFit.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/single

      - name: בניית המתקין (MSI)
        run: >
          dotnet build installer/FrameFit.wixproj -c Release
          -p:OutputName=FrameFit-${{ github.ref_name }}-x64

      - name: הכנת הקבצים וסכומי הבדיקה
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $portable = "FrameFit-$version-win-x64-portable.exe"
          $msi = "FrameFit-$version-x64.msi"

          Copy-Item publish/single/FrameFit.exe $portable
          Copy-Item "installer/bin/x64/Release/FrameFit-$version-x64.msi" $msi

          # כתיבת סכום הבדיקה בפורמט סטנדרטי: hash ואחריו שני רווחים ושם הקובץ.
          foreach ($file in @($portable, $msi)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            "$hash  $file" | Out-File -FilePath "$file.sha256" -Encoding ascii -NoNewline
          }

      - name: העלאה למהדורה
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrameFit-*-win-x64-portable.exe
            FrameFit-*-win-x64-portable.exe.sha256
            FrameFit-*-x64.msi
            FrameFit-*-x64.msi.sha256
          generate_release_notes: false
