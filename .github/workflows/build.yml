name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: בנייה ובדיקות
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: שחזור ובנייה
        run: dotnet build FrameFit.slnx -c Release

      - name: בדיקות יחידה
        run: dotnet test tests/FrameFit.Core.Tests/FrameFit.Core.Tests.csproj -c Release --no-build

  release:
    name: פרסום מהדורה
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: פרסום עצמאי (self-contained)
        run: >
          dotnet publish src/FrameFit.App/FrameFit.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: אריזה
        shell: pwsh
        run: |
          # סמלי ניפוי נחוצים לפיתוח ולא להפצה.
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue

          $name = "FrameFit-${{ github.ref_name }}-win-x64"
          Compress-Archive -Path publish/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          # כתיבת סכום הבדיקה בפורמט סטנדרטי: hash ואחריו שני רווחים ושם הקובץ.
          "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii -NoNewline

      - name: העלאה למהדורה
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FrameFit-*.zip
            FrameFit-*.zip.sha256
          generate_release_notes: false
